name: Nightly events crawl
# The run name carries the group, so the Cloudflare trigger (nexus-crawl-cron) and the guard below can tell
# which group a run belongs to: "Nightly crawl eu-af" (dispatch) or "Nightly crawl 7 1 * * *" (GitHub schedule).
run-name: "Nightly crawl ${{ github.event_name == 'schedule' && github.event.schedule || inputs.group || 'all' }}"

# Reads the public event pages of every listed church website once a night, in each country's own
# night: sites are grouped by time zone (crawler/tzgroups.py), and each group has its own cron so
# its churches are read at roughly 2-4 AM local time. Each group is split across parallel matrix
# jobs and publishes its own release asset, "nightly-<group>" (nexus-events.tar.gz + summary.json).
# No secrets are used: the only token is the automatic GITHUB_TOKEN, with write access only in the publish job.
#
#   group  UTC cron (m h)  local time (winter / summer)
#   eu-af  7 1             Paris 2:07 / 3:07, London 1:07 / 2:07, Abidjan 1:07, Kinshasa 2:07
#   br     7 5             Brasilia 2:07
#   na-e   7 7             New York 2:07 / 3:07
#   na-c   7 8             Chicago 2:07 / 3:07
#   na-m   7 9             Denver 2:07 / 3:07 (Phoenix 2:07)
#   na-p   7 10            Los Angeles 2:07 / 3:07, Anchorage 1:07, Honolulu 0:07
#   au-e   7 16            Sydney 3:07 / 2:07 (AEDT / AEST), Brisbane 2:07
#   au-w   7 18            Perth 2:07
# Punctual trigger: the Cloudflare Worker nexus-crawl-cron dispatches each group on time (workflow_dispatch,
# group=<id>). GitHub's own schedule below is only the fallback: it was 6-9 h late, and a scheduled run skips
# every group whose "nightly-<group>" release is younger than 12 h or which already has a run in progress.
# The Nexus site job merges each release a few hours later (see .github/workflows/nexus-nightly-events.yml there).
on:
  schedule:
    - cron: "7 1 * * *"
    - cron: "7 5 * * *"
    - cron: "7 7 * * *"
    - cron: "7 8 * * *"
    - cron: "7 9 * * *"
    - cron: "7 10 * * *"
    - cron: "7 16 * * *"
    - cron: "7 18 * * *"
  workflow_dispatch:
    inputs:
      group:
        description: "Time-zone group to crawl: eu-af, br, na-e, na-c, na-m, na-p, au-e, au-w, or all"
        required: false
        default: "all"
      limit:
        description: "Max sites per country in each shard (0 = all). Use a small number for a test run."
        required: false
        default: "0"
      seconds:
        description: "Time budget per shard, in seconds"
        required: false
        default: "6000"

permissions:
  contents: read

concurrency:
  group: nightly-crawl-${{ github.event.schedule || github.event.inputs.group || 'all' }}
  cancel-in-progress: false

env:
  NEXUS_EVENTS_ALLOW_HTTP: "1"
  TZ: America/Denver

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      matrix: ${{ steps.plan.outputs.matrix }}
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python3 crawler/tzgroups.py plan "${{ github.event.schedule || github.event.inputs.group || 'all' }}" >> "$GITHUB_OUTPUT"
      - name: Fallback guard (scheduled runs only; skip a group already crawled by the on-time trigger)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GROUPS_JSON: ${{ steps.plan.outputs.groups }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          skip=false
          for g in $(echo "$GROUPS_JSON" | jq -r '.[]'); do
            cron=$(python3 -c "import sys; sys.path.insert(0,'crawler'); import tzgroups; print(tzgroups.GROUPS['$g']['cron'])")
            # 1. Release asset of this group younger than 12 h -> the on-time trigger already crawled it tonight.
            asset=$(gh api "repos/${{ github.repository }}/releases/tags/nightly-$g" \
                      --jq '[.assets[] | select(.name=="nexus-events.tar.gz") | .updated_at][0] // empty' 2>/dev/null || true)
            if [ -n "$asset" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$asset" +%s) ))
              if [ "$age" -lt 43200 ]; then echo "::notice::Group $g crawled $((age / 60)) min ago; this late scheduled run skips it."; skip=true; continue; fi
            fi
            # 2. Another run of the same group queued or in progress (e.g. dispatched on time, still crawling).
            busy=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly-crawl.yml/runs?per_page=50" \
                     --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\")
                            | select(.display_title==\"Nightly crawl $g\" or .display_title==\"Nightly crawl all\" or .display_title==\"Nightly crawl $cron * * *\")] | length")
            if [ "$busy" != "0" ]; then echo "::notice::Group $g already has a run in progress; this scheduled run skips it."; skip=true; fi
          done
          # Every schedule fires exactly one group, so skipping one group skips the run.
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  crawl:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Last night's events of this group (seed, so unchanged pages keep their events)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          # "nightly-<group>"; the first night after the switch falls back to the old single "nightly" release
          # (merge_shards keeps only this group's churches either way).
          for tag in "nightly-${{ matrix.group }}" nightly; do
            if gh release download "$tag" --repo "${{ github.repository }}" -p nexus-events.tar.gz -D "$RUNNER_TEMP"; then
              tar -xzf "$RUNNER_TEMP/nexus-events.tar.gz" -C previous
              break
            fi
          done
      - name: Restore ETag / Last-Modified cache for this shard
        uses: actions/cache@v4
        with:
          path: http-cache
          key: http-cache-${{ matrix.group }}-${{ matrix.shard }}-of-${{ matrix.shards }}-${{ github.run_id }}
          restore-keys: |
            http-cache-${{ matrix.group }}-${{ matrix.shard }}-of-${{ matrix.shards }}-
      - name: Crawl ${{ matrix.group }} shard ${{ matrix.shard }}
        run: |
          python3 crawler/run_shard.py \
            --group "${{ matrix.group }}" \
            --shard "${{ matrix.shard }}" --shards "${{ matrix.shards }}" \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --seconds "${{ github.event.inputs.seconds || '6000' }}" \
            --previous previous --work work --http-cache http-cache/http-cache.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.group }}-${{ matrix.shard }}
          path: work/
          retention-days: 3
          if-no-files-found: warn

  publish:
    needs: [plan, crawl]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ matrix.group }}-*
          path: shards
      - name: Merge shards
        run: |
          shards=$(python3 -c "import sys; sys.path.insert(0,'crawler'); import tzgroups; print(tzgroups.GROUPS['${{ matrix.group }}']['shards'])")
          python3 crawler/merge_shards.py --group "${{ matrix.group }}" --shards-dir shards --shards "$shards" --out merged \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          tar -czf nexus-events.tar.gz -C merged .
          cp merged/summary.json summary.json
      - name: Publish the "nightly-${{ matrix.group }}" release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="nightly-${{ matrix.group }}"
          notes="Nightly crawl of group ${{ matrix.group }}, $(date -u +%Y-%m-%dT%H:%MZ). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" nexus-events.tar.gz summary.json --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" nexus-events.tar.gz summary.json --title "Nightly events (${{ matrix.group }})" --notes "$notes" --target "${{ github.sha }}"
          fi
      - name: Job summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("summary.json"))
          print(f"### Group {s['group']}")
          print("| Country | Sites | Attempted | Finished | Read OK | Events | Missing shards |")
          print("|---|---|---|---|---|---|---|")
          for cc, v in s["countries"].items():
              print(f"| {cc} | {v['sites']} | {v['sitesAttempted']} | {v['sitesFinished']} | {v['sitesReadOk']} | {v['events']} | {v['shardsMissing']} |")
          PY
